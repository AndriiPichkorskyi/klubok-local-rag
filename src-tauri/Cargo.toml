[package]
name = "local-tool-rag-assistant"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "local_tool_rag_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: без неї на macOS немає прозорого вікна (рамка підсвічування).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sysinfo = "0.39.6"

# Обидва крейти вже є у Cargo.lock як залежності tao/wry — прямими вони стають
# без нових пакетів у збірці. Потрібні лише для macOS:
# core-graphics — перевірка дозволу на запис екрана і список вікон,
# core-foundation — типи, якими CGWindowList віддає опис вікна.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
# libc — лише для SIGTERM дочірньому sidecar при виході: Child::kill() у std
# надсилає SIGKILL, а нам потрібен чистий вихід (server.js на SIGTERM віддає
# файл-замок і закриває з'єднання). Крейт уже є в Cargo.lock.
libc = "0.2"
